name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deploy builds from live scraped data, not the committed baseline:
      # the baseline can be weeks old, and a push deploy that skips the
      # scrape silently overwrites the daily cron's fresh deploy (seen live
      # 2026-09-09: merging a PR regressed prod to August data). A failed
      # scrape fails the deploy loudly — silently shipping stale duty
      # rosters is worse than a red build.
      - name: Scrape pharmacy data
        run: npm run scrape -- antalya

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # Call wrangler directly rather than via cloudflare/wrangler-action.
        # The action runs `npm i wrangler` inside the repo, which triggers npm's
        # full-tree resolution and can disturb the project's installed deps.
        # `npx --yes` fetches wrangler into an isolated cache and runs it, never
        # touching the project tree. wrangler reads the token/account from env.
        run: npx --yes wrangler@4 pages deploy dist --project-name=eczane --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
